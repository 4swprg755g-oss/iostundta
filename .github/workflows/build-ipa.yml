name: Build Real iOS IPA
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build Unsigned App
        run: |
          xcodebuild -project Dnoffset.xcodeproj             -scheme Dnoffset             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Dnoffset.app Payload/
          zip -r Dnoffset.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dnoffset-IPA
          path: Dnoffset.ipa
